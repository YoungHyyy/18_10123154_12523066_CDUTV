map $http_x_request_id $trace_request_id {
  ""      $request_id;
  default $http_x_request_id;
}

log_format frontend_trace escape=json
  '{"time":"$time_iso8601","level":"INFO","service":"frontend","req":"$trace_request_id","method":"$request_method","path":"$uri","status":$status,"duration_seconds":$request_time}';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  access_log /dev/stdout frontend_trace;

  location = /health {
    default_type application/json;
    alias /tmp/frontend-health.json;
    add_header Cache-Control "no-store" always;
  }

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $trace_request_id;
    proxy_hide_header X-Request-ID;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
