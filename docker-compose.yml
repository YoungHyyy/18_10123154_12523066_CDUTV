services:
  ai-service:
    build: ./ai-models/service
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    volumes:
      - ./ai-models/models:/app/models
    restart: unless-stopped

  backend:
    build: ./app/backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - AI_SERVICE_URL=http://ai-service:8000
      - MONGO_URI=${MONGO_URI}
    depends_on:
      - ai-service
    restart: unless-stopped

  frontend:
    build: ./app/frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped
