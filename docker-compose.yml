services:
  ai-service:
    build:
      context: ./ai-models
      dockerfile: service/Dockerfile
    ports:
      - "${AI_SERVICE_HOST_PORT:-8001}:8001"
    environment:
      PORT: 8001
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    environment:
      PORT: 8000
      AI_SERVICE_URL: ${AI_SERVICE_URL_DOCKER:-http://ai-service:8001}
      MONGODB_URI: ${MONGODB_URI_DOCKER:-mongodb://mongodb:27017/breast_cancer}
      SCHEMA_PATH: /app/models/schema.json
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      mongodb:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: app/frontend/Dockerfile
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -q -O - http://127.0.0.1/health | grep -q ''"status":"ok","service":"frontend","port":80''',
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      backend:
        condition: service_healthy

  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "${MONGODB_HOST_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
